<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>关于</title>
    <!-- 清爽字体，干净留白，突出“关于”信息 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f0f4f9 0%, #d9e2ed 100%);
            padding: 20px;
        }

        /* 计算器风格卡片 — 圆润、有层次、无大按钮 */
        .about-card {
            max-width: 420px;
            width: 100%;
            background: #eef3f9;
            border-radius: 48px;
            padding: 36px 28px 32px;
            box-shadow: 
                20px 20px 40px rgba(0, 10, 20, 0.15),
                -10px -10px 30px rgba(255, 255, 255, 0.7),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        /* 显示屏区域 — 保留计算器经典设计 */
        .display-area {
            background: #d2dfec;
            border-radius: 28px;
            padding: 18px 22px 14px;
            margin-bottom: 28px;
            box-shadow: 
                inset 6px 6px 12px rgba(0, 0, 0, 0.08),
                inset -4px -4px 10px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .display-area .title {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: #3a4a5e;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 2px;
        }

        .display-area .main-text {
            font-size: 28px;
            font-weight: 600;
            color: #1e2a36;
            letter-spacing: 0.5px;
            line-height: 1.2;
            word-break: break-word;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        .display-area .sub-text {
            font-size: 16px;
            font-weight: 400;
            color: #3f5369;
            margin-top: 6px;
            opacity: 0.8;
            border-top: 1px dashed rgba(60, 80, 100, 0.15);
            padding-top: 6px;
        }

        /* 关于内容主体 — 干净、易读，完全替代按钮区域 */
        .about-content {
            margin: 12px 0 18px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 24px 26px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.6);
        }

        .about-content h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1d2d3f;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .about-content h3 span {
            background: #2a4057;
            color: white;
            font-size: 14px;
            font-weight: 500;
            padding: 0 16px;
            border-radius: 40px;
            line-height: 28px;
            letter-spacing: 0.3px;
        }

        .about-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(60, 80, 100, 0.07);
        }

        .about-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .about-item .label {
            color: #3e556b;
            font-weight: 450;
            font-size: 16px;
            letter-spacing: 0.2px;
        }

        .about-item .value {
            color: #13212e;
            font-weight: 500;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.25);
            padding: 0 14px;
            border-radius: 30px;
            line-height: 30px;
            white-space: nowrap;
        }

        .about-item .value.highlight {
            background: #2e4b66;
            color: white;
            padding: 0 18px;
        }

        /* 底部装饰 — 保留计算器风格点缀，无按钮 */
        .footer-note {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 18px;
            font-size: 13px;
            color: #445f78;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.7;
            flex-wrap: wrap;
        }

        .footer-note span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-note i {
            font-style: normal;
            background: #b6ccdf;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .divider-light {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #4e6a82;
            opacity: 0.4;
            letter-spacing: 0.8px;
            border-top: 1px solid rgba(80, 100, 120, 0.1);
            padding-top: 16px;
        }

        /* 响应式微调 */
        @media (max-width: 460px) {
            .about-card {
                padding: 24px 16px 26px;
                border-radius: 36px;
            }
            .display-area .main-text {
                font-size: 22px;
            }
            .about-content {
                padding: 18px 16px;
            }
            .about-item {
                flex-wrap: wrap;
                gap: 4px;
            }
            .about-item .value {
                white-space: normal;
                padding: 0 12px;
                line-height: 28px;
            }
            .footer-note {
                gap: 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="about-card">

        <!-- 模拟计算器显示区域 (关于标题) -->
        <div class="display-area">
            <div class="title">▪ 关于</div>
            <div class="main-text">ABOUT</div>
            <div class="sub-text">版本 1.0 · 简洁高效</div>
        </div>

        <!-- 关于信息卡片 — 替代了之前的大按钮区域，内容更聚焦 -->
        <div class="about-content">
            <h3>
                📟 关于
                <span>v1.0</span>
            </h3>

            <div class="about-item">
                <span class="label">开发者</span>
                <span class="value">Wuter</span>
            </div>
            <div class="about-item">
                <span class="label">版本</span>
                <span class="value highlight">1.0.github.5</span>
            </div>
            <div class="about-item">
                <span class="label">构建日期</span>
                <span class="value">2026.08.01</span>
            </div>
            <div class="about-item">
                <span class="label">支持平台</span>
                <span class="value">Web端</span>
            </div>
            <div class="about-item">
                <span class="label">开源协议</span>
                <span class="value">MIT</span>
            </div>
        </div>

        <div class="divider-light">
            ⚡ 简洁 · 可靠
        </div>
    </div>
</body>
</html>
