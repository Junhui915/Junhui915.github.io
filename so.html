<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>智能起始页</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, minimum-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    
    <!-- 使用 logo.png -->
    <link rel="icon" type="images/png" href="images/logo.png">
    <link rel="apple-touch-icon" href="images/logo.png">
    
    <link href="css/start-page.css" rel="stylesheet">
    <link href="css/jcrop.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- 移动端顶部栏 -->
    <div id="mobile-top-bar" class="mobile-top-bar">
        <div class="mobile-logo-container">
            <!-- 使用 logo.png -->
            <img src="images/logo.png" alt="Logo" class="mobile-logo" id="mobile-logo">
            <span class="mobile-title">智能起始页</span>
        </div>
        <div class="mobile-actions">
            <button class="mobile-action-btn" onclick="toggleTheme()">
                <i class="fas fa-moon"></i>
            </button>
            <button class="mobile-action-btn" onclick="refreshPage()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <div id="container" class="container">
        <!-- 桌面端Logo（同时支持移动端） -->
        <header id="head">
            <div id="logo" class="logo-main">
                <!-- 使用 logo.png -->
                <img src="images/logo.png" alt="Logo" class="logo-image" id="logo-image">
                <div class="logo-text">智能起始页</div>
            </div>
            
            <!-- 搜索框区域 -->
            <div class="search-area">
                <div class="search-box-wrapper">
                    <div class="search-box">
                        <div class="search-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <input type="text" id="search-input" placeholder="搜索或输入网址..." 
                               autocomplete="off" spellcheck="false" autocapitalize="off">
                        <div class="search-actions">
                            <button class="search-action-btn" onclick="voiceSearch()" title="语音搜索">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <button class="search-action-btn" onclick="scanQRCode()" title="扫描二维码">
                                <i class="fas fa-qrcode"></i>
                            </button>
                            <button class="search-action-btn" onclick="clearSearch()" title="清空">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 搜索引擎切换 -->
                    <div class="search-engines">
                        <div class="engine-selector">
                            <select id="search-engine">
                                <option value="baidu">百度</option>
                                <option value="google">Google</option>
                                <option value="bing">必应</option>
                                <option value="duckduckgo">DuckDuckGo</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <!-- 快速导航卡片 -->
            <div class="quick-nav-grid">
                <div class="nav-card" onclick="navigateTo('bookmarks')">
                    <div class="nav-icon">
                        <i class="fas fa-bookmark"></i>
                    </div>
                    <div class="nav-label">书签</div>
                </div>
                <div class="nav-card" onclick="navigateTo('history')">
                    <div class="nav-icon">
                        <i class="fas fa-history"></i>
                    </div>
                    <div class="nav-label">历史</div>
                </div>
                <div class="nav-card" onclick="navigateTo('downloads')">
                    <div class="nav-icon">
                        <i class="fas fa-download"></i>
                    </div>
                    <div class="nav-label">下载</div>
                </div>
                <div class="nav-card" onclick="navigateTo('apps')">
                    <div class="nav-icon">
                        <i class="fas fa-th-large"></i>
                    </div>
                    <div class="nav-label">应用</div>
                </div>
                <div class="nav-card" onclick="navigateTo('settings')">
                    <div class="nav-icon">
                        <i class="fas fa-cog"></i>
                    </div>
                    <div class="nav-label">设置</div>
                </div>
                <div class="nav-card" onclick="showMoreOptions()">
                    <div class="nav-icon">
                        <i class="fas fa-ellipsis-h"></i>
                    </div>
                    <div class="nav-label">更多</div>
                </div>
            </div>

            <!-- 天气和时间卡片 -->
            <div class="info-card">
                <div class="weather-section">
                    <div class="weather-icon">
                        <i class="fas fa-sun" id="weather-icon"></i>
                    </div>
                    <div class="weather-info">
                        <div class="temperature" id="temperature">24°C</div>
                        <div class="weather-desc" id="weather-desc">晴朗</div>
                        <div class="location" id="location">当前位置</div>
                    </div>
                </div>
                <div class="time-section">
                    <div class="current-time" id="current-time">00:00:00</div>
                    <div class="current-date" id="current-date">2024年1月1日</div>
                    <div class="day-of-week" id="day-of-week">星期一</div>
                </div>
            </div>

            <!-- 常用网站网格 -->
            <div class="section">
                <div class="section-header">
                    <h3><i class="fas fa-star"></i> 常用网站</h3>
                    <button class="section-action" onclick="editQuickLinks()">
                        <i class="fas fa-edit"></i> 编辑
                    </button>
                </div>
                <div class="quick-links-grid" id="quick-links-grid">
                    <!-- 快速链接将动态生成 -->
                </div>
            </div>

            <!-- 待办事项 -->
            <div class="section">
                <div class="section-header">
                    <h3><i class="fas fa-tasks"></i> 今日待办</h3>
                    <div class="todo-actions">
                        <button class="todo-action-btn" onclick="addTodoItem()">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="todo-action-btn" onclick="clearCompletedTodos()">
                            <i class="fas fa-check-double"></i>
                        </button>
                    </div>
                </div>
                <div class="todo-container">
                    <div class="todo-list" id="todo-list">
                        <!-- 待办事项将动态生成 -->
                    </div>
                    <div class="todo-input-container">
                        <input type="text" id="new-todo-input" placeholder="添加新任务..." 
                               onkeypress="handleTodoKeypress(event)">
                        <button class="add-todo-btn" onclick="addTodoFromInput()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 最近访问 -->
            <div class="section">
                <div class="section-header">
                    <h3><i class="fas fa-clock"></i> 最近访问</h3>
                    <button class="section-action" onclick="clearHistory()">
                        <i class="fas fa-trash"></i> 清空
                    </button>
                </div>
                <div class="history-list" id="history-list">
                    <!-- 历史记录将动态生成 -->
                </div>
            </div>

            <!-- 原有的功能区域（保持兼容） -->
            <div id="panel-image-clip" style="display: none;">
                <!-- 原有图片裁剪功能 -->
            </div>

            <div id="panel-dir" style="display: none;">
                <!-- 原有目录功能 -->
            </div>
        </main>

        <!-- 移动端底部导航 -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" onclick="switchTab('home')">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('apps')">
                <i class="fas fa-th-large"></i>
                <span>应用</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('search')">
                <i class="fas fa-search"></i>
                <span>搜索</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('bookmarks')">
                <i class="fas fa-bookmark"></i>
                <span>收藏</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('profile')">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </a>
        </nav>

        <!-- 悬浮操作按钮 -->
        <div class="floating-actions">
            <button class="fab main-fab" onclick="toggleQuickActions()">
                <i class="fas fa-plus"></i>
            </button>
            <div class="fab-menu" id="fab-menu">
                <button class="fab-action" onclick="addQuickLink()">
                    <i class="fas fa-link"></i>
                    <span>添加快捷链接</span>
                </button>
                <button class="fab-action" onclick="addTodoItem()">
                    <i class="fas fa-tasks"></i>
                    <span>添加待办</span>
                </button>
                <button class="fab-action" onclick="changeBackground()">
                    <i class="fas fa-image"></i>
                    <span>更换背景</span>
                </button>
                <button class="fab-action" onclick="sharePage()">
                    <i class="fas fa-share-alt"></i>
                    <span>分享页面</span>
                </button>
            </div>
        </div>

        <!-- Logo点击功能菜单 -->
        <div class="logo-menu" id="logo-menu">
            <div class="menu-item" onclick="changeLogo()">
                <i class="fas fa-image"></i>
                <span>更换Logo</span>
            </div>
            <div class="menu-item" onclick="resetLogo()">
                <i class="fas fa-undo"></i>
                <span>重置Logo</span>
            </div>
            <div class="menu-item" onclick="uploadLogo()">
                <i class="fas fa-upload"></i>
                <span>上传Logo</span>
            </div>
            <div class="menu-item" onclick="aboutLogo()">
                <i class="fas fa-info-circle"></i>
                <span>关于Logo</span>
            </div>
        </div>
    </div>

    <script>
        // 初始化函数
        function initStartPage() {
            console.log('初始化起始页');
            
            // 加载Logo
            loadLogo();
            
            // 初始化日期时间
            initDateTime();
            
            // 初始化天气
            initWeather();
            
            // 初始化待办事项
            initTodos();
            
            // 初始化快速链接
            initQuickLinks();
            
            // 初始化历史记录
            initHistory();
            
            // 初始化事件监听
            initEventListeners();
            
            // 移动端适配
            adaptToMobile();
            
            // 保持原有功能
            if (typeof initStartPageOriginal === 'function') {
                initStartPageOriginal();
            }
        }

        // Logo相关功能
        function loadLogo() {
            const logoImage = document.getElementById('logo-image');
            const mobileLogo = document.getElementById('mobile-logo');
            
            // 尝试从localStorage加载自定义Logo
            const customLogo = localStorage.getItem('customLogo');
            
            if (customLogo) {
                logoImage.src = customLogo;
                if (mobileLogo) mobileLogo.src = customLogo;
            } else {
                // 使用默认logo.png
                logoImage.src = 'images/logo.png';
                if (mobileLogo) mobileLogo.src = 'images/logo.png';
            }
            
            // Logo点击事件
            logoImage.addEventListener('click', showLogoMenu);
            if (mobileLogo) mobileLogo.addEventListener('click', showLogoMenu);
        }

        function showLogoMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('logo-menu');
            menu.classList.toggle('show');
            
            // 点击其他地方关闭菜单
            setTimeout(() => {
                document.addEventListener('click', function closeMenu(e) {
                    if (!menu.contains(e.target) && e.target !== event.target) {
                        menu.classList.remove('show');
                        document.removeEventListener('click', closeMenu);
                    }
                });
            }, 0);
        }

        function changeLogo() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const logoUrl = e.target.result;
                        localStorage.setItem('customLogo', logoUrl);
                        loadLogo();
                        showMessage('Logo已更新');
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        function resetLogo() {
            localStorage.removeItem('customLogo');
            loadLogo();
            showMessage('Logo已重置');
        }

        function uploadLogo() {
            // 这里可以添加上传到服务器的功能
            alert('Logo上传功能需要后端支持');
        }

        function aboutLogo() {
            alert('当前Logo: logo.png\n尺寸: 建议使用正方形图片\n格式: PNG、JPG、SVG');
        }

        // 日期时间功能
        function initDateTime() {
            function updateDateTime() {
                const now = new Date();
                
                // 更新时间
                const timeEl = document.getElementById('current-time');
                if (timeEl) {
                    timeEl.textContent = now.toLocaleTimeString('zh-CN');
                }
                
                // 更新日期
                const dateEl = document.getElementById('current-date');
                if (dateEl) {
                    dateEl.textContent = now.toLocaleDateString('zh-CN', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }
                
                // 更新星期
                const weekEl = document.getElementById('day-of-week');
                if (weekEl) {
                    const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                    weekEl.textContent = days[now.getDay()];
                }
            }
            
            updateDateTime();
            setInterval(updateDateTime, 1000);
        }

        // 天气功能
        function initWeather() {
            // 尝试获取位置
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        fetchWeather(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        // 使用默认天气
                        setDefaultWeather();
                    }
                );
            } else {
                setDefaultWeather();
            }
        }

        async function fetchWeather(lat, lon) {
            try {
                // 这里使用公开的天气API示例
                // 实际使用时需要替换为真实的API
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                
                if (data.current_weather) {
                    updateWeatherDisplay(data.current_weather);
                }
            } catch (error) {
                console.error('获取天气失败:', error);
                setDefaultWeather();
            }
        }

        function updateWeatherDisplay(weather) {
            const tempEl = document.getElementById('temperature');
            const descEl = document.getElementById('weather-desc');
            const iconEl = document.getElementById('weather-icon');
            
            if (tempEl) {
                tempEl.textContent = `${Math.round(weather.temperature)}°C`;
            }
            
            if (descEl) {
                // 根据天气码转换描述
                const descriptions = {
                    0: '晴朗',
                    1: '大部分晴朗',
                    2: '部分多云',
                    3: '多云',
                    45: '雾',
                    48: '雾',
                    51: '毛毛雨',
                    53: '毛毛雨',
                    55: '毛毛雨',
                    56: '冻毛毛雨',
                    57: '冻毛毛雨',
                    61: '小雨',
                    63: '中雨',
                    65: '大雨',
                    71: '小雪',
                    73: '中雪',
                    75: '大雪',
                    77: '冰雹',
                    80: '阵雨',
                    81: '强阵雨',
                    82: '暴雨',
                    85: '阵雪',
                    86: '强阵雪',
                    95: '雷暴',
                    96: '雷暴伴冰雹',
                    99: '强雷暴伴冰雹'
                };
                descEl.textContent = descriptions[weather.weathercode] || '未知';
            }
            
            if (iconEl) {
                // 根据天气码设置图标
                const icons = {
                    0: 'fa-sun',
                    1: 'fa-cloud-sun',
                    2: 'fa-cloud-sun',
                    3: 'fa-cloud',
                    45: 'fa-smog',
                    48: 'fa-smog',
                    51: 'fa-cloud-rain',
                    53: 'fa-cloud-rain',
                    55: 'fa-cloud-rain',
                    61: 'fa-cloud-rain',
                    63: 'fa-cloud-showers-heavy',
                    65: 'fa-cloud-showers-heavy',
                    71: 'fa-snowflake',
                    73: 'fa-snowflake',
                    75: 'fa-snowflake',
                    77: 'fa-cloud-meatball',
                    80: 'fa-cloud-rain',
                    81: 'fa-cloud-showers-heavy',
                    82: 'fa-poo-storm',
                    85: 'fa-snowflake',
                    86: 'fa-snowflake',
                    95: 'fa-bolt',
                    96: 'fa-poo-storm',
                    99: 'fa-poo-storm'
                };
                const iconClass = icons[weather.weathercode] || 'fa-cloud';
                iconEl.className = `fas ${iconClass}`;
            }
        }

        function setDefaultWeather() {
            const tempEl = document.getElementById('temperature');
            const descEl = document.getElementById('weather-desc');
            const locationEl = document.getElementById('location');
            
            if (tempEl) tempEl.textContent = '24°C';
            if (descEl) descEl.textContent = '晴朗';
            if (locationEl) locationEl.textContent = '当前位置';
        }

        // 待办事项功能
        function initTodos() {
            const todos = JSON.parse(localStorage.getItem('todos')) || [];
            renderTodos(todos);
        }

        function renderTodos(todos) {
            const todoList = document.getElementById('todo-list');
            if (!todoList) return;
            
            if (todos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-todo">
                        <i class="fas fa-clipboard-list"></i>
                        <p>暂无待办事项</p>
                    </div>
                `;
                return;
            }
            
            const html = todos.map((todo, index) => `
                <div class="todo-item ${todo.completed ? 'completed' : ''}" data-index="${index}">
                    <div class="todo-checkbox">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} 
                               onchange="toggleTodo(${index})">
                    </div>
                    <div class="todo-text">${todo.text}</div>
                    <div class="todo-actions">
                        <button class="todo-action-btn small" onclick="editTodo(${index})" title="编辑">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="todo-action-btn small" onclick="deleteTodo(${index})" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            todoList.innerHTML = html;
        }

        function addTodoItem() {
            const text = prompt('请输入待办事项:');
            if (text && text.trim()) {
                const todos = JSON.parse(localStorage.getItem('todos')) || [];
                todos.push({
                    text: text.trim(),
                    completed: false,
                    createdAt: new Date().toISOString()
                });
                localStorage.setItem('todos', JSON.stringify(todos));
                renderTodos(todos);
            }
        }

        function addTodoFromInput() {
            const input = document.getElementById('new-todo-input');
            if (input && input.value.trim()) {
                const todos = JSON.parse(localStorage.getItem('todos')) || [];
                todos.push({
                    text: input.value.trim(),
                    completed: false,
                    createdAt: new Date().toISOString()
                });
                localStorage.setItem('todos', JSON.stringify(todos));
                renderTodos(todos);
                input.value = '';
            }
        }

        function handleTodoKeypress(event) {
            if (event.key === 'Enter') {
                addTodoFromInput();
            }
        }

        function toggleTodo(index) {
            const todos = JSON.parse(localStorage.getItem('todos')) || [];
            if (todos[index]) {
                todos[index].completed = !todos[index].completed;
                localStorage.setItem('todos', JSON.stringify(todos));
                renderTodos(todos);
            }
        }

        function editTodo(index) {
            const todos = JSON.parse(localStorage.getItem('todos')) || [];
            const todo = todos[index];
            if (todo) {
                const newText = prompt('编辑待办事项:', todo.text);
                if (newText && newText.trim()) {
                    todo.text = newText.trim();
                    localStorage.setItem('todos', JSON.stringify(todos));
                    renderTodos(todos);
                }
            }
        }

        function deleteTodo(index) {
            if (confirm('确定要删除这个待办事项吗？')) {
                const todos = JSON.parse(localStorage.getItem('todos')) || [];
                todos.splice(index, 1);
                localStorage.setItem('todos', JSON.stringify(todos));
                renderTodos(todos);
            }
        }

        function clearCompletedTodos() {
            if (confirm('确定要清除所有已完成的待办事项吗？')) {
                const todos = JSON.parse(localStorage.getItem('todos')) || [];
                const activeTodos = todos.filter(todo => !todo.completed);
                localStorage.setItem('todos', JSON.stringify(activeTodos));
                renderTodos(activeTodos);
            }
        }

        // 快速链接功能
        function initQuickLinks() {
            const links = JSON.parse(localStorage.getItem('quickLinks')) || [
                { name: 'GitHub', url: 'https://github.com', icon: 'fab fa-github' },
                { name: '知乎', url: 'https://www.zhihu.com', icon: 'fab fa-zhihu' },
                { name: 'B站', url: 'https://www.bilibili.com', icon: 'fab fa-bilibili' },
                { name: 'ChatGPT', url: 'https://chat.openai.com', icon: 'fas fa-robot' },
                { name: 'Google', url: 'https://google.com', icon: 'fab fa-google' },
                { name: '百度', url: 'https://baidu.com', icon: 'fab fa-baidu' }
            ];
            
            renderQuickLinks(links);
        }

        function renderQuickLinks(links) {
            const grid = document.getElementById('quick-links-grid');
            if (!grid) return;
            
            const html = links.map(link => `
                <div class="quick-link-item" onclick="window.open('${link.url}', '_blank')">
                    <div class="quick-link-icon">
                        <i class="${link.icon}"></i>
                    </div>
                    <div class="quick-link-name">${link.name}</div>
                </div>
            `).join('');
            
            grid.innerHTML = html;
        }

        function editQuickLinks() {
            alert('快速链接编辑功能');
            // 这里可以实现更复杂的编辑界面
        }

        // 历史记录功能
        function initHistory() {
            const history = JSON.parse(localStorage.getItem('recentHistory')) || [];
            renderHistory(history);
        }

        function renderHistory(history) {
            const list = document.getElementById('history-list');
            if (!list) return;
            
            if (history.length === 0) {
                list.innerHTML = `
                    <div class="empty-history">
                        <i class="fas fa-history"></i>
                        <p>暂无最近访问记录</p>
                    </div>
                `;
                return;
            }
            
            const html = history.slice(0, 5).map(item => `
                <div class="history-item" onclick="window.open('${item.url}', '_blank')">
                    <div class="history-icon">
                        <i class="fas fa-globe"></i>
                    </div>
                    <div class="history-info">
                        <div class="history-title">${item.title}</div>
                        <div class="history-url">${item.url}</div>
                        <div class="history-time">${item.time}</div>
                    </div>
                </div>
            `).join('');
            
            list.innerHTML = html;
        }

                renderHistory([]);
            }
        }

        function initEventListeners() {
            // 搜索功能
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            // 窗口大小变化
            window.addEventListener('resize', adaptToMobile);
            
            // 主题切换
            const themeToggle = document.querySelector('[onclick="toggleTheme()"]');
            if (themeToggle) {
                themeToggle.addEventListener('click', toggleTheme);
            }
        }

        // 移动端适配
        function adaptToMobile() {
            const isMobile = window.innerWidth <= 768;
            document.body.classList.toggle('mobile-view', isMobile);
            
            // 移动端特定调整
            if (isMobile) {
                adjustForMobile();
            } else {
                adjustForDesktop();
            }
        }

            console.log('移动端视图');
        }

        }

        // 工具函数
        function performSearch() {
            const input = document.getElementById('search-input');
            const engine = document.getElementById('search-engine').value;
            
            if (input && input.value.trim()) {
                const query = encodeURIComponent(input.value.trim());
                let url = '';
                
                switch (engine) {
                    case 'baidu':
                        url = `https://www.baidu.com/s?wd=${query}`;
                        break;
                    case 'google':
                        url = `https://www.google.com/search?q=${query}`;
                        break;
                    case 'bing':
                        url = `https://www.bing.com/search?q=${query}`;
                        break;
                    case 'duckduckgo':
                        url = `https://duckduckgo.com/?q=${query}`;
                        break;
                }
                
                window.open(url, '_blank');
            }
        }

        function voiceSearch() {
            if ('webkitSpeechRecognition' in window) {
                const recognition = new webkitSpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('search-input').value = transcript;
                    performSearch();
                };
                recognition.start();
            } else {
                alert('您的浏览器不支持语音搜索');
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.querySelector('[onclick="toggleTheme()"] i');
            if (icon) {
                icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            }
