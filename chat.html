<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>全模型通用 · 多会话助手</title>
    <!-- Font Awesome 6 (免费) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f4f7fc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            max-height: 900px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* 头部 */
        .app-header {
            padding: 16px 24px;
            background: #ffffff;
            border-bottom: 1px solid #e9edf4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area i {
            font-size: 26px;
            color: #4a6cf7;
            background: #eef2ff;
            padding: 10px;
            border-radius: 14px;
        }

        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .config-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .config-field {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 40px;
            padding: 4px 6px 4px 16px;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }
        .config-field:focus-within {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74,108,247,0.15);
        }
        .config-field input {
            border: none;
            background: transparent;
            padding: 8px 6px;
            font-size: 0.85rem;
            width: 150px;
            outline: none;
            color: #1e293b;
        }
        .config-field input::placeholder {
            color: #94a3b8;
            font-size: 0.75rem;
        }
        .config-field i {
            color: #64748b;
            font-size: 0.8rem;
            margin-right: 4px;
        }
        .config-field button {
            background: transparent;
            border: none;
            color: #64748b;
            padding: 6px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.15s;
        }
        .config-field button:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        .save-status {
            font-size: 0.7rem;
            color: #16a34a;
            min-width: 40px;
            margin-left: 2px;
        }

        .btn-primary {
            background: #4a6cf7;
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #4a6cf7;
            white-space: nowrap;
        }
        .btn-primary:hover {
            background: #3b5de7;
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #d1d9e6;
            color: #334155;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .btn-danger-outline {
            background: transparent;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-danger-outline:hover {
            background: #fee2e2;
        }

        /* 主体 */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧会话列表 */
        .session-sidebar {
            width: 260px;
            background: #f8fafc;
            border-right: 1px solid #e9edf4;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.2s;
            overflow: hidden;
        }

        .session-sidebar-header {
            padding: 16px 16px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9edf4;
        }
        .session-sidebar-header h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
            letter-spacing: 0.3px;
        }
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px 20px;
            list-style: none;
        }
        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            margin-bottom: 4px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.15s;
            background: transparent;
            border: 1px solid transparent;
        }
        .session-item:hover {
            background: #eef2ff;
            border-color: #d9e2f0;
        }
        .session-item.active {
            background: #ffffff;
            border-color: #4a6cf7;
            box-shadow: 0 2px 8px rgba(74,108,247,0.08);
        }
        .session-item .session-name {
            flex: 1;
            font-size: 0.9rem;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            margin-right: 8px;
        }
        .session-item .session-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .session-item .session-actions button {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            font-size: 0.75rem;
            transition: 0.1s;
        }
        .session-item .session-actions button:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        .session-item .session-actions .del-btn:hover {
            color: #b91c1c;
            background: #fee2e2;
        }
        .add-session-btn {
            margin: 8px 16px 16px;
            width: calc(100% - 32px);
            background: #eef2ff;
            border: 1px dashed #4a6cf7;
            color: #4a6cf7;
            padding: 10px 0;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .add-session-btn:hover {
            background: #d9e2ff;
        }

        /* 聊天区 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            min-width: 0;
        }

        .chat-header {
            padding: 14px 24px;
            border-bottom: 1px solid #e9edf4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafcff;
            flex-shrink: 0;
        }
        .chat-header .session-title {
            font-weight: 600;
            color: #0f172a;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header .session-title i {
            color: #4a6cf7;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafcff;
        }

        .message {
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 24px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .message.user {
            align-self: flex-end;
            background: #4a6cf7;
            color: white;
            border-bottom-right-radius: 8px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #f1f5f9;
            color: #0f172a;
            border-bottom-left-radius: 8px;
        }
        .message .role-tag {
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 4px;
            display: block;
            letter-spacing: 0.3px;
        }
        .message.user .role-tag { color: rgba(255,255,255,0.85); }
        .message.assistant .role-tag { color: #475569; }

        .chat-input-area {
            padding: 16px 24px 20px;
            border-top: 1px solid #e9edf4;
            background: #ffffff;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .chat-input-area textarea {
            flex: 1;
            border: 1px solid #d1d9e6;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: 0.2s;
            min-height: 52px;
            background: #f8fafc;
            font-family: inherit;
        }
        .chat-input-area textarea:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74,108,247,0.12);
            background: white;
        }
        .chat-input-area .send-btn {
            background: #4a6cf7;
            border: none;
            color: white;
            width: 56px;
            border-radius: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input-area .send-btn:hover {
            background: #3b5de7;
            transform: scale(0.94);
        }
        .chat-input-area .send-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0.4; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            gap: 8px;
        }
        .empty-state i {
            font-size: 3rem;
            opacity: 0.4;
        }

        /* 响应式 */
        @media (max-width: 820px) {
            .config-field input { width: 110px; }
        }
        @media (max-width: 720px) {
            .app-container { max-height: 100vh; border-radius: 20px; }
            .session-sidebar { width: 200px; }
            .config-field input { width: 100px; }
            .message { max-width: 90%; }
        }
        @media (max-width: 580px) {
            .app-header { flex-direction: column; align-items: stretch; gap: 8px; }
            .header-actions { flex-direction: column; align-items: stretch; }
            .config-group { flex-direction: column; align-items: stretch; }
            .config-field { width: 100%; }
            .config-field input { width: 100%; }
            .main-layout { flex-direction: column; }
            .session-sidebar {
                width: 100%;
                max-height: 180px;
                border-right: none;
                border-bottom: 1px solid #e9edf4;
            }
            .session-list {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 8px 12px;
                gap: 8px;
            }
            .session-item {
                flex: 0 0 auto;
                width: 140px;
                border: 1px solid #e2e8f0;
                background: white;
                padding: 8px 12px;
            }
            .session-item .session-name { font-size: 0.8rem; }
            .add-session-btn { width: auto; margin: 8px 12px; padding: 6px 16px; font-size: 0.8rem; }
            .session-sidebar-header { padding: 8px 12px; }
            .chat-messages { padding: 16px; }
            .chat-input-area { padding: 12px 16px 16px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 头部：可配置 API 地址 / Key / 模型名 -->
    <header class="app-header">
        <div class="logo-area">
            <i class="fas fa-brain"></i>
            <h1>AI 通用</h1>
            <span style="font-size:0.8rem; color:#64748b; background:#f1f5f9; padding:2px 12px; border-radius:40px;">多会话</span>
        </div>
        <div class="header-actions">
            <div class="config-group">
                <div class="config-field">
                    <i class="fas fa-link"></i>
                    <input type="text" id="apiBaseInput" placeholder="API 地址" value="https://api.deepseek.com/v1/chat/completions">
                </div>
                <div class="config-field">
                    <i class="fas fa-key"></i>
                    <input type="password" id="apiKeyInput" placeholder="API Key" value="">
                    <button id="saveApiKeyBtn"><i class="fas fa-save"></i></button>
                    <span class="save-status" id="saveStatus"></span>
                </div>
                <div class="config-field" style="flex:0 1 140px;">
                    <i class="fas fa-tag"></i>
                    <input type="text" id="modelNameInput" placeholder="模型名" value="deepseek-chat">
                </div>
            </div>
            <button class="btn-outline" id="clearCurrentChatBtn"><i class="fas fa-eraser"></i> 清空</button>
        </div>
    </header>

    <!-- 主体 -->
    <div class="main-layout">
        <aside class="session-sidebar">
            <div class="session-sidebar-header">
                <h3><i class="fas fa-comments" style="margin-right:6px;"></i> 会话</h3>
                <span style="font-size:0.7rem; color:#94a3b8;" id="sessionCount">0</span>
            </div>
            <ul class="session-list" id="sessionList"></ul>
            <button class="add-session-btn" id="addSessionBtn"><i class="fas fa-plus-circle"></i> 新建会话</button>
        </aside>

        <section class="chat-area">
            <div class="chat-header">
                <div class="session-title"><i class="fas fa-message"></i> <span id="currentSessionName">默认会话</span></div>
                <div>
                    <button class="btn-danger-outline" id="deleteCurrentSessionBtn" style="margin-right:4px;"><i class="fas fa-trash-can"></i> 删除</button>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <i class="fas fa-comment-dots"></i>
                    <p>开始对话吧</p>
                </div>
            </div>
            <div class="chat-input-area">
                <textarea id="userInput" rows="1" placeholder="输入消息… (Enter 发送, Shift+Enter 换行)"></textarea>
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </section>
    </div>
</div>

<script>
    (function() {
        // ---------- 状态 ----------
        let sessions = [];
        let currentSessionId = null;
        let apiKey = '';
        let apiBase = 'https://api.deepseek.com/v1/chat/completions';
        let modelName = 'deepseek-chat';

        // DOM
        const sessionListEl = document.getElementById('sessionList');
        const chatMessagesEl = document.getElementById('chatMessages');
        const userInputEl = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const addSessionBtn = document.getElementById('addSessionBtn');
        const clearCurrentChatBtn = document.getElementById('clearCurrentChatBtn');
        const deleteCurrentSessionBtn = document.getElementById('deleteCurrentSessionBtn');
        const currentSessionNameEl = document.getElementById('currentSessionName');
        const sessionCountEl = document.getElementById('sessionCount');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiBaseInput = document.getElementById('apiBaseInput');
        const modelNameInput = document.getElementById('modelNameInput');
        const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
        const saveStatus = document.getElementById('saveStatus');

        // ---------- 工具 ----------
        function generateId() {
            return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        }

        function createDefaultSession() {
            return { id: generateId(), name: '新会话 ' + (sessions.length + 1), messages: [] };
        }

        // 存储
        function saveToStorage() {
            try {
                const data = {
                    sessions,
                    currentSessionId,
                    apiKey,
                    apiBase,
                    modelName
                };
                localStorage.setItem('ai_multi_session_universal', JSON.stringify(data));
            } catch (_) {}
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem('ai_multi_session_universal');
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (data.sessions && Array.isArray(data.sessions) && data.sessions.length > 0) {
                    sessions = data.sessions;
                    currentSessionId = data.currentSessionId || sessions[0].id;
                    apiKey = data.apiKey || '';
                    apiBase = data.apiBase || 'https://api.deepseek.com/v1/chat/completions';
                    modelName = data.modelName || 'deepseek-chat';
                    if (apiKey) apiKeyInput.value = apiKey;
                    apiBaseInput.value = apiBase;
                    modelNameInput.value = modelName;
                    return true;
                }
            } catch (_) {}
            return false;
        }

        function ensureCurrentSession() {
            if (sessions.length === 0) {
                const ns = createDefaultSession();
                sessions.push(ns);
                currentSessionId = ns.id;
            } else {
                const exists = sessions.some(s => s.id === currentSessionId);
                if (!exists) currentSessionId = sessions[0].id;
            }
        }

        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId) || null;
        }

        // ---------- 渲染 ----------
        function renderSessionList() {
            sessionListEl.innerHTML = '';
            sessions.forEach(session => {
                const li = document.createElement('li');
                li.className = 'session-item' + (session.id === currentSessionId ? ' active' : '');
                li.dataset.id = session.id;

                const nameSpan = document.createElement('span');
                nameSpan.className = 'session-name';
                nameSpan.textContent = session.name || '未命名';
                li.appendChild(nameSpan);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'session-actions';

                const renameBtn = document.createElement('button');
                renameBtn.innerHTML = '<i class="fas fa-pen"></i>';
                renameBtn.title = '重命名';
                renameBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newName = prompt('输入新名称:', session.name);
                    if (newName && newName.trim() !== '') {
                        session.name = newName.trim();
                        renderAll();
                        saveToStorage();
                    }
                });
                actionsDiv.appendChild(renameBtn);

                const delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.innerHTML = '<i class="fas fa-trash-can"></i>';
                delBtn.title = '删除会话';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (sessions.length <= 1) {
                        alert('至少保留一个会话');
                        return;
                    }
                    if (confirm(`删除会话“${session.name}”吗？`)) {
                        const idx = sessions.findIndex(s => s.id === session.id);
                        if (idx !== -1) {
                            sessions.splice(idx, 1);
                            if (currentSessionId === session.id) currentSessionId = sessions[0].id;
                            renderAll();
                            saveToStorage();
                        }
                    }
                });
                actionsDiv.appendChild(delBtn);

                li.appendChild(actionsDiv);
                li.addEventListener('click', () => {
                    if (currentSessionId !== session.id) {
                        currentSessionId = session.id;
                        renderAll();
                        saveToStorage();
                    }
                });
                sessionListEl.appendChild(li);
            });
            sessionCountEl.textContent = sessions.length;
            const cur = getCurrentSession();
            currentSessionNameEl.textContent = cur ? cur.name : '未选择';
        }

        function renderMessages() {
            chatMessagesEl.innerHTML = '';
            const session = getCurrentSession();
            if (!session) {
                chatMessagesEl.innerHTML = `<div class="empty-state"><i class="fas fa-comment-slash"></i><p>请选择会话</p></div>`;
                return;
            }
            if (session.messages.length === 0) {
                chatMessagesEl.innerHTML = `<div class="empty-state"><i class="fas fa-comment-dots"></i><p>开始对话吧</p></div>`;
                return;
            }
            session.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;
                const tag = document.createElement('span');
                tag.className = 'role-tag';
                tag.textContent = msg.role === 'user' ? '👤 你' : '🤖 AI';
                div.appendChild(tag);
                const content = document.createElement('div');
                content.textContent = msg.content;
                div.appendChild(content);
                chatMessagesEl.appendChild(div);
            });
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        }

        function renderAll() {
            renderSessionList();
            renderMessages();
            const session = getCurrentSession();
            if (!session) {
                userInputEl.disabled = true;
                sendBtn.disabled = true;
            } else {
                userInputEl.disabled = false;
                sendBtn.disabled = false;
            }
        }

        // ---------- 核心 API 调用 (通用) ----------
        async function callModel(userMessage) {
            const session = getCurrentSession();
            if (!session) return false;

            // 读取最新配置
            const baseUrl = apiBaseInput.value.trim() || 'https://api.deepseek.com/v1/chat/completions';
            const key = apiKeyInput.value.trim();
            const model = modelNameInput.value.trim() || 'deepseek-chat';
            if (!key) {
                alert('请填写 API Key');
                return false;
            }
            // 同步到内存
            apiKey = key;
            apiBase = baseUrl;
            modelName = model;
            saveToStorage();

            // 添加用户消息
            session.messages.push({ role: 'user', content: userMessage });
            renderMessages();
            saveToStorage();

            const history = session.messages.slice(-12).map(m => ({ role: m.role, content: m.content }));

            try {
                const response = await fetch(baseUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: history,
                        temperature: 0.7,
                        max_tokens: 800,
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    let errMsg = `API 错误 (${response.status})`;
                    try {
                        const errJson = JSON.parse(errText);
                        errMsg = errJson.error?.message || errMsg;
                    } catch (_) {}
                    throw new Error(errMsg);
                }

                const data = await response.json();
                const assistantMessage = data.choices?.[0]?.message?.content;
                if (!assistantMessage) throw new Error('未收到有效回复');

                session.messages.push({ role: 'assistant', content: assistantMessage });
                renderMessages();
                saveToStorage();
                return true;
            } catch (error) {
                alert('调用失败: ' + error.message);
                session.messages.pop();
                renderMessages();
                saveToStorage();
                return false;
            }
        }

        // ---------- 事件 ----------
        async function handleSend() {
            const session = getCurrentSession();
            if (!session) { alert('请先创建或选择一个会话'); return; }
            const text = userInputEl.value.trim();
            if (!text) return;
            userInputEl.value = '';
            userInputEl.style.height = 'auto';
            await callModel(text);
        }

        function addNewSession() {
            const ns = createDefaultSession();
            sessions.push(ns);
            currentSessionId = ns.id;
            renderAll();
            saveToStorage();
            userInputEl.focus();
        }

        function clearCurrentChat() {
            const session = getCurrentSession();
            if (!session || session.messages.length === 0) return;
            if (confirm('清空当前会话的所有消息？')) {
                session.messages = [];
                renderMessages();
                saveToStorage();
            }
        }

        function deleteCurrentSession() {
            if (sessions.length <= 1) { alert('至少保留一个会话'); return; }
            const session = getCurrentSession();
            if (!session) return;
            if (confirm(`删除会话“${session.name}”及其所有消息吗？`)) {
                const idx = sessions.findIndex(s => s.id === session.id);
                if (idx !== -1) {
                    sessions.splice(idx, 1);
                    currentSessionId = sessions[0].id;
                    renderAll();
                    saveToStorage();
                }
            }
        }

        function saveConfig() {
            const key = apiKeyInput.value.trim();
            const base = apiBaseInput.value.trim() || 'https://api.deepseek.com/v1/chat/completions';
            const model = modelNameInput.value.trim() || 'deepseek-chat';
            apiKey = key;
            apiBase = base;
            modelName = model;
            saveToStorage();
            saveStatus.textContent = '✓ 已保存';
            setTimeout(() => { saveStatus.textContent = ''; }, 2500);
        }

        // ---------- 初始化 ----------
        function init() {
            const loaded = loadFromStorage();
            if (!loaded) {
                const defaultSession = createDefaultSession();
                sessions = [defaultSession];
                currentSessionId = defaultSession.id;
                apiKey = '';
                apiBase = 'https://api.deepseek.com/v1/chat/completions';
                modelName = 'deepseek-chat';
                apiBaseInput.value = apiBase;
                modelNameInput.value = modelName;
            } else {
                ensureCurrentSession();
                apiBaseInput.value = apiBase;
                modelNameInput.value = modelName;
                if (apiKey) apiKeyInput.value = apiKey;
            }
            renderAll();
            saveToStorage();

            // 事件绑定
            sendBtn.addEventListener('click', handleSend);
            userInputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });
            userInputEl.addEventListener('input', () => {
                userInputEl.style.height = 'auto';
                userInputEl.style.height = Math.min(userInputEl.scrollHeight, 120) + 'px';
            });
            addSessionBtn.addEventListener('click', addNewSession);
            clearCurrentChatBtn.addEventListener('click', clearCurrentChat);
            deleteCurrentSessionBtn.addEventListener('click', deleteCurrentSession);
            saveApiKeyBtn.addEventListener('click', saveConfig);
            chatMessagesEl.addEventListener('click', () => userInputEl.focus());
        }

        init();
    })();
</script>
</body>
</html>
