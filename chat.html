<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>DeepSeek 多会话助手</title>
    <!-- Font Awesome 图标库 (免费版本) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f4f7fc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            max-height: 900px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* 头部 */
        .app-header {
            padding: 16px 24px;
            background: #ffffff;
            border-bottom: 1px solid #e9edf4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area i {
            font-size: 26px;
            color: #4a6cf7;
            background: #eef2ff;
            padding: 10px;
            border-radius: 14px;
        }

        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .api-key-wrapper {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 40px;
            padding: 4px 6px 4px 16px;
            border: 1px solid #e2e8f0;
            transition: 0.2s;
        }
        .api-key-wrapper:focus-within {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74,108,247,0.15);
        }
        .api-key-wrapper input {
            border: none;
            background: transparent;
            padding: 8px 6px;
            font-size: 0.9rem;
            width: 160px;
            outline: none;
            color: #1e293b;
        }
        .api-key-wrapper input::placeholder {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .api-key-wrapper button {
            background: transparent;
            border: none;
            color: #64748b;
            padding: 6px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.15s;
        }
        .api-key-wrapper button:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        .save-status {
            font-size: 0.75rem;
            color: #16a34a;
            margin-left: 4px;
            min-width: 40px;
        }

        .btn-primary {
            background: #4a6cf7;
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #4a6cf7;
            white-space: nowrap;
        }
        .btn-primary:hover {
            background: #3b5de7;
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #d1d9e6;
            color: #334155;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .btn-danger-outline {
            background: transparent;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-danger-outline:hover {
            background: #fee2e2;
        }

        /* 主体：会话列表 + 聊天区 */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧会话列表 */
        .session-sidebar {
            width: 260px;
            background: #f8fafc;
            border-right: 1px solid #e9edf4;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.2s;
            overflow: hidden;
        }

        .session-sidebar-header {
            padding: 16px 16px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9edf4;
        }
        .session-sidebar-header h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
            letter-spacing: 0.3px;
        }
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px 20px;
            list-style: none;
        }
        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            margin-bottom: 4px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.15s;
            background: transparent;
            border: 1px solid transparent;
        }
        .session-item:hover {
            background: #eef2ff;
            border-color: #d9e2f0;
        }
        .session-item.active {
            background: #ffffff;
            border-color: #4a6cf7;
            box-shadow: 0 2px 8px rgba(74,108,247,0.08);
        }
        .session-item .session-name {
            flex: 1;
            font-size: 0.9rem;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            margin-right: 8px;
        }
        .session-item .session-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .session-item .session-actions button {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            font-size: 0.75rem;
            transition: 0.1s;
        }
        .session-item .session-actions button:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        .session-item .session-actions .del-btn:hover {
            color: #b91c1c;
            background: #fee2e2;
        }
        .add-session-btn {
            margin: 8px 16px 16px;
            width: calc(100% - 32px);
            background: #eef2ff;
            border: 1px dashed #4a6cf7;
            color: #4a6cf7;
            padding: 10px 0;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .add-session-btn:hover {
            background: #d9e2ff;
        }

        /* 右侧聊天区 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            min-width: 0;
        }

        .chat-header {
            padding: 14px 24px;
            border-bottom: 1px solid #e9edf4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafcff;
            flex-shrink: 0;
        }
        .chat-header .session-title {
            font-weight: 600;
            color: #0f172a;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header .session-title i {
            color: #4a6cf7;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafcff;
        }

        .message {
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 24px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .message.user {
            align-self: flex-end;
            background: #4a6cf7;
            color: white;
            border-bottom-right-radius: 8px;
        }
        .message.assistant {
            align-self: flex-start;
            background: #f1f5f9;
            color: #0f172a;
            border-bottom-left-radius: 8px;
        }
        .message .role-tag {
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 4px;
            display: block;
            letter-spacing: 0.3px;
        }
        .message.user .role-tag { color: rgba(255,255,255,0.85); }
        .message.assistant .role-tag { color: #475569; }

        .chat-input-area {
            padding: 16px 24px 20px;
            border-top: 1px solid #e9edf4;
            background: #ffffff;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .chat-input-area textarea {
            flex: 1;
            border: 1px solid #d1d9e6;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: 0.2s;
            min-height: 52px;
            background: #f8fafc;
            font-family: inherit;
        }
        .chat-input-area textarea:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74,108,247,0.12);
            background: white;
        }
        .chat-input-area .send-btn {
            background: #4a6cf7;
            border: none;
            color: white;
            width: 56px;
            border-radius: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input-area .send-btn:hover {
            background: #3b5de7;
            transform: scale(0.94);
        }
        .chat-input-area .send-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0.4; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            gap: 8px;
        }
        .empty-state i {
            font-size: 3rem;
            opacity: 0.4;
        }

        /* 响应式 */
        @media (max-width: 720px) {
            .app-container {
                max-height: 100vh;
                border-radius: 20px;
            }
            .session-sidebar {
                width: 200px;
            }
            .api-key-wrapper input {
                width: 110px;
            }
            .chat-header .session-title {
                font-size: 0.9rem;
            }
            .message {
                max-width: 90%;
            }
        }
        @media (max-width: 580px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header-actions {
                justify-content: space-between;
            }
            .api-key-wrapper {
                flex: 1;
            }
            .api-key-wrapper input {
                width: 100%;
            }
            .main-layout {
                flex-direction: column;
            }
            .session-sidebar {
                width: 100%;
                max-height: 180px;
                border-right: none;
                border-bottom: 1px solid #e9edf4;
            }
            .session-list {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 8px 12px;
                gap: 8px;
            }
            .session-item {
                flex: 0 0 auto;
                width: 140px;
                border: 1px solid #e2e8f0;
                background: white;
                padding: 8px 12px;
            }
            .session-item .session-name {
                font-size: 0.8rem;
            }
            .add-session-btn {
                width: auto;
                margin: 8px 12px;
                padding: 6px 16px;
                font-size: 0.8rem;
            }
            .session-sidebar-header {
                padding: 8px 12px;
            }
            .chat-messages {
                padding: 16px;
            }
            .chat-input-area {
                padding: 12px 16px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="app-header">
            <div class="logo-area">
                <i class="fas fa-robot"></i>
                <h1>DeepSeek</h1>
                <span style="font-size:0.8rem; color:#64748b; background:#f1f5f9; padding:2px 12px; border-radius:40px;">多会话</span>
            </div>
            <div class="header-actions">
                <div class="api-key-wrapper">
                    <i class="fas fa-key" style="color:#64748b; font-size:0.8rem;"></i>
                    <input type="password" id="apiKeyInput" placeholder="输入 API Key" value="">
                    <button id="saveApiKeyBtn"><i class="fas fa-save"></i></button>
                    <span class="save-status" id="saveStatus"></span>
                </div>
                <button class="btn-outline" id="clearCurrentChatBtn"><i class="fas fa-eraser"></i> 清空</button>
            </div>
        </header>

        <!-- 主体 -->
        <div class="main-layout">
            <!-- 左侧会话列表 -->
            <aside class="session-sidebar">
                <div class="session-sidebar-header">
                    <h3><i class="fas fa-comments" style="margin-right:6px;"></i> 会话</h3>
                    <span style="font-size:0.7rem; color:#94a3b8;" id="sessionCount">0</span>
                </div>
                <ul class="session-list" id="sessionList"></ul>
                <button class="add-session-btn" id="addSessionBtn"><i class="fas fa-plus-circle"></i> 新建会话</button>
            </aside>

            <!-- 聊天区域 -->
            <section class="chat-area">
                <div class="chat-header">
                    <div class="session-title"><i class="fas fa-message"></i> <span id="currentSessionName">默认会话</span></div>
                    <div>
                        <button class="btn-danger-outline" id="deleteCurrentSessionBtn" style="margin-right:4px;"><i class="fas fa-trash-can"></i> 删除</button>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="empty-state">
                        <i class="fas fa-comment-dots"></i>
                        <p>开始对话吧</p>
                    </div>
                </div>
                <div class="chat-input-area">
                    <textarea id="userInput" rows="1" placeholder="输入消息… (Enter 发送, Shift+Enter 换行)"></textarea>
                    <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </section>
        </div>
    </div>
    <script>
        (function() {
            // ---------- 数据结构 ----------
            let sessions = [];              // { id, name, messages: [{role, content}] }
            let currentSessionId = null;
            let apiKey = '';

            // DOM 元素
            const sessionListEl = document.getElementById('sessionList');
            const chatMessagesEl = document.getElementById('chatMessages');
            const userInputEl = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const addSessionBtn = document.getElementById('addSessionBtn');
            const clearCurrentChatBtn = document.getElementById('clearCurrentChatBtn');
            const deleteCurrentSessionBtn = document.getElementById('deleteCurrentSessionBtn');
            const currentSessionNameEl = document.getElementById('currentSessionName');
            const sessionCountEl = document.getElementById('sessionCount');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
            const saveStatus = document.getElementById('saveStatus');

            // ---------- 辅助函数 ----------
            function generateId() {
                return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            }

            // 默认创建首个会话
            function createDefaultSession() {
                return {
                    id: generateId(),
                    name: '新会话 ' + (sessions.length + 1),
                    messages: []
                };
            }

            // 保存到 localStorage
            function saveToStorage() {
                try {
                    const data = {
                        sessions: sessions,
                        currentSessionId: currentSessionId,
                        apiKey: apiKey
                    };
                    localStorage.setItem('deepseek_multi_session', JSON.stringify(data));
                } catch (e) {}
            }

            // 从 localStorage 加载
            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem('deepseek_multi_session');
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (data.sessions && Array.isArray(data.sessions) && data.sessions.length > 0) {
                        sessions = data.sessions;
                        currentSessionId = data.currentSessionId || sessions[0].id;
                        apiKey = data.apiKey || '';
                        if (apiKey) {
                            apiKeyInput.value = apiKey;
                        }
                        return true;
                    }
                } catch (e) {}
                return false;
            }

            // 确保当前会话有效
            function ensureCurrentSession() {
                if (sessions.length === 0) {
                    const newSession = createDefaultSession();
                    sessions.push(newSession);
                    currentSessionId = newSession.id;
                } else {
                    const exists = sessions.some(s => s.id === currentSessionId);
                    if (!exists) {
                        currentSessionId = sessions[0].id;
                    }
                }
            }

            // 获取当前会话对象
            function getCurrentSession() {
                return sessions.find(s => s.id === currentSessionId) || null;
            }

            // 渲染会话列表
            function renderSessionList() {
                sessionListEl.innerHTML = '';
                sessions.forEach(session => {
                    const li = document.createElement('li');
                    li.className = 'session-item' + (session.id === currentSessionId ? ' active' : '');
                    li.dataset.id = session.id;

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'session-name';
                    nameSpan.textContent = session.name || '未命名';
                    li.appendChild(nameSpan);

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'session-actions';

                    // 重命名按钮
                    const renameBtn = document.createElement('button');
                    renameBtn.innerHTML = '<i class="fas fa-pen"></i>';
                    renameBtn.title = '重命名';
                    renameBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const newName = prompt('输入新名称:', session.name);
                        if (newName && newName.trim() !== '') {
                            session.name = newName.trim();
                            renderAll();
                            saveToStorage();
                        }
                    });
                    actionsDiv.appendChild(renameBtn);

                    // 删除按钮 (不能删除最后一个)
                    const delBtn = document.createElement('button');
                    delBtn.className = 'del-btn';
                    delBtn.innerHTML = '<i class="fas fa-trash-can"></i>';
                    delBtn.title = '删除会话';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (sessions.length <= 1) {
                            alert('至少保留一个会话');
                            return;
                        }
                        if (confirm(`确定删除会话“${session.name}”吗？`)) {
                            const idx = sessions.findIndex(s => s.id === session.id);
                            if (idx !== -1) {
                                sessions.splice(idx, 1);
                                if (currentSessionId === session.id) {
                                    currentSessionId = sessions[0].id;
                                }
                                renderAll();
                                saveToStorage();
                            }
                        }
                    });
                    actionsDiv.appendChild(delBtn);

                    li.appendChild(actionsDiv);

                    // 点击切换会话
                    li.addEventListener('click', () => {
                        if (currentSessionId !== session.id) {
                            currentSessionId = session.id;
                            renderAll();
                            saveToStorage();
                        }
                    });

                    sessionListEl.appendChild(li);
                });
                sessionCountEl.textContent = sessions.length;

                // 更新当前会话名称
                const cur = getCurrentSession();
                if (cur) {
                    currentSessionNameEl.textContent = cur.name;
                } else {
                    currentSessionNameEl.textContent = '未选择';
                }
            }

            // 渲染聊天消息
            function renderMessages() {
                chatMessagesEl.innerHTML = '';
                const session = getCurrentSession();
                if (!session) {
                    chatMessagesEl.innerHTML = `<div class="empty-state"><i class="fas fa-comment-slash"></i><p>请选择会话</p></div>`;
                    return;
                }
                if (session.messages.length === 0) {
                    chatMessagesEl.innerHTML = `<div class="empty-state"><i class="fas fa-comment-dots"></i><p>开始对话吧</p></div>`;
                    return;
                }
                session.messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.role}`;
                    const tag = document.createElement('span');
                    tag.className = 'role-tag';
                    tag.textContent = msg.role === 'user' ? '👤 你' : '🤖 DeepSeek';
                    div.appendChild(tag);
                    const content = document.createElement('div');
                    content.textContent = msg.content;
                    div.appendChild(content);
                    chatMessagesEl.appendChild(div);
                });
                chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
            }

            // 整体渲染
            function renderAll() {
                renderSessionList();
                renderMessages();
                // 更新输入框状态
                const session = getCurrentSession();
                if (!session) {
                    userInputEl.disabled = true;
                    sendBtn.disabled = true;
                } else {
                    userInputEl.disabled = false;
                    sendBtn.disabled = false;
                }
            }

            // ---------- 核心 API 调用 ----------
            async function callDeepSeek(userMessage) {
                const session = getCurrentSession();
                if (!session) return false;
                if (!apiKey || apiKey.trim() === '') {
                    alert('请先保存 API Key');
                    return false;
                }

                // 添加用户消息到界面
                session.messages.push({ role: 'user', content: userMessage });
                renderMessages();
                saveToStorage();

                // 构造请求消息 (只取最近10条，防止过长)
                const history = session.messages.slice(-10).map(m => ({ role: m.role, content: m.content }));

                try {
                    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey.trim()}`
                        },
                        body: JSON.stringify({
                            model: 'deepseek-chat',
                            messages: history,
                            temperature: 0.7,
                            max_tokens: 800,
                            stream: false
                        })
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        let errMsg = `API 错误 (${response.status})`;
                        try {
                            const errJson = JSON.parse(errText);
                            errMsg = errJson.error?.message || errMsg;
                        } catch (_) {}
                        throw new Error(errMsg);
                    }

                    const data = await response.json();
                    const assistantMessage = data.choices?.[0]?.message?.content;
                    if (!assistantMessage) {
                        throw new Error('未收到有效回复');
                    }

                    // 添加助手消息
                    session.messages.push({ role: 'assistant', content: assistantMessage });
                    renderMessages();
                    saveToStorage();
                    return true;
                } catch (error) {
                    alert('调用失败: ' + error.message);
                    // 移除之前添加的用户消息（因为请求失败）
                    session.messages.pop();
                    renderMessages();
                    saveToStorage();
                    return false;
                }
            }

            // ---------- 事件绑定 ----------
            // 发送消息
            async function handleSend() {
                const session = getCurrentSession();
                if (!session) {
                    alert('请先创建或选择一个会话');
                    return;
                }
                const text = userInputEl.value.trim();
                if (!text) return;
                userInputEl.value = '';
                userInputEl.style.height = 'auto';
                await callDeepSeek(text);
            }

            // 新建会话
            function addNewSession() {
                const newSession = createDefaultSession();
                sessions.push(newSession);
                currentSessionId = newSession.id;
                renderAll();
                saveToStorage();
                userInputEl.focus();
            }

            // 清空当前会话消息
            function clearCurrentChat() {
                const session = getCurrentSession();
                if (!session) return;
                if (session.messages.length === 0) return;
                if (confirm('清空当前会话的所有消息？')) {
                    session.messages = [];
                    renderMessages();
                    saveToStorage();
                }
            }

            // 删除当前会话
            function deleteCurrentSession() {
                if (sessions.length <= 1) {
                    alert('至少保留一个会话');
                    return;
                }
                const session = getCurrentSession();
                if (!session) return;
                if (confirm(`确定删除会话“${session.name}”及其所有消息吗？`)) {
                    const idx = sessions.findIndex(s => s.id === session.id);
                    if (idx !== -1) {
                        sessions.splice(idx, 1);
                        currentSessionId = sessions[0].id;
                        renderAll();
                        saveToStorage();
                    }
                }
            }

            // 保存 API Key
            function saveApiKey() {
                const key = apiKeyInput.value.trim();
                if (key) {
                    apiKey = key;
                    saveToStorage();
                    saveStatus.textContent = '✓ 已保存';
                    setTimeout(() => { saveStatus.textContent = ''; }, 2500);
                } else {
                    apiKey = '';
                    saveToStorage();
                    saveStatus.textContent = '已清除';
                    setTimeout(() => { saveStatus.textContent = ''; }, 2000);
                }
            }

            // ---------- 初始化 ----------
            function init() {
                // 加载存储数据
                const loaded = loadFromStorage();
                if (!loaded) {
                    // 创建默认会话
                    const defaultSession = createDefaultSession();
                    sessions = [defaultSession];
                    currentSessionId = defaultSession.id;
                    apiKey = '';
                } else {
                    // 确保会话存在
                    ensureCurrentSession();
                }
                // 同步 apiKey 到 input
                if (apiKey) {
                    apiKeyInput.value = apiKey;
                }
                renderAll();
                saveToStorage();

                // 事件监听
                sendBtn.addEventListener('click', handleSend);
                userInputEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleSend();
                    }
                });
                // 自动调整高度
                userInputEl.addEventListener('input', () => {
                    userInputEl.style.height = 'auto';
                    userInputEl.style.height = Math.min(userInputEl.scrollHeight, 120) + 'px';
                });
                addSessionBtn.addEventListener('click', addNewSession);
                clearCurrentChatBtn.addEventListener('click', clearCurrentChat);
                deleteCurrentSessionBtn.addEventListener('click', deleteCurrentSession);
                saveApiKeyBtn.addEventListener('click', saveApiKey);

                // 点击空白区域聚焦输入
                chatMessagesEl.addEventListener('click', () => {
                    userInputEl.focus();
                });
            }

            init();
        })();
    </script>
</body>
</html>
